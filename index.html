<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>QR para MP3 con descarga JPG</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-top: 40px;
    }
    #qrcode {
      margin-top: 1rem;
    }
    input, button {
      padding: 0.6rem;
      min-width: 280px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Generar QR para descargar MP3</h2>

  <input type="text" id="urlInput" placeholder="Pegá acá el link directo al MP3" />

  <button onclick="generarQR()">Generar QR</button>

  <div id="qrcode"></div>

  <button onclick="descargarQR()">Descargar JPG</button>

  <script>
    function generarQR() {
      const url = document.getElementById("urlInput").value.trim();
      if (!url) {
        alert("Ingresá un enlace válido al MP3");
        return;
      }

      // Limpiar QR anterior
      document.getElementById("qrcode").innerHTML = "";

      // Crear QR nuevo
      new QRCode(document.getElementById("qrcode"), {
        text: url,
        width: 256,
        height: 256
      });
    }

    function descargarQR() {
      const qrCanvas = document.querySelector("#qrcode canvas");

      if (!qrCanvas) {
        alert("Primero generá el QR");
        return;
      }

      // Convertir canvas a JPG
      const imgData = qrCanvas.toDataURL("image/jpeg");

      // Crear link para descargar
      const link = document.createElement("a");
      link.href = imgData;
      link.download = "qr_mp3.jpg";

      link.click();
    }
  </script>

</body>
</html>
