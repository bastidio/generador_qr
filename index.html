<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>QR para MP3 con nombre personalizado</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-top: 40px;
    }
    input, button {
      padding: 0.6rem;
      min-width: 280px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <h2>Generar QR para MP3</h2>

  <input type="text" id="urlInput" placeholder="Pegá el link del MP3" />

  <input type="text" id="nombreInput" placeholder="Nombre del archivo (sin .jpg)" />

  <button onclick="generarQR()">Generar QR</button>

  <div id="qrcode"></div>

  <button onclick="descargarQR()">Descargar JPG</button>

  <script>
    function generarQR() {
      const url = document.getElementById("urlInput").value.trim();
      if (!url) {
        alert("Ingresá un enlace válido");
        return;
      }

      document.getElementById("qrcode").innerHTML = "";

      new QRCode(document.getElementById("qrcode"), {
        text: url,
        width: 256,
        height: 256
      });
    }

    function descargarQR() {
      const canvas = document.querySelector("#qrcode canvas");
      if (!canvas) {
        alert("Generá el QR primero");
        return;
      }

      const nombre = document.getElementById("nombreInput").value.trim() || "qr_mp3";

      // Convertir canvas a JPG
      const imgData = canvas.toDataURL("image/jpeg");

      // Crear link de descarga
      const link = document.createElement("a");
      link.href = imgData;
      link.download = nombre + ".jpg";
      link.click();
    }
  </script>

</body>
</html>
