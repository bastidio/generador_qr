<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Generar QR para MP3</title>
  <!-- Librería QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-top: 40px;
    }
    #qrcode {
      margin-top: 1rem;
    }
    input {
      padding: 0.5rem;
      min-width: 280px;
    }
    button {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Generar QR para descargar MP3</h1>

  <input
    type="text"
    id="urlInput"
    placeholder="Pegá acá el link directo al MP3"
  />
  <button onclick="generarQR()">Generar QR</button>

  <div id="qrcode"></div>

  <script>
    function generarQR() {
      const url = document.getElementById('urlInput').value.trim();

      if (!url) {
        alert("Ingresá un enlace válido al MP3");
        return;
      }

      // Limpiar QR previo
      document.getElementById("qrcode").innerHTML = "";

      // Crear QR
      new QRCode(document.getElementById("qrcode"), {
        text: url,
        width: 256,
        height: 256
      });
    }
  </script>
</body>
</html>
